name: Build offline driving graph

on:
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  routing:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: region-package
          run-id: 31437658426
          github-token: ${{ github.token }}
          path: Maps/jamaica
      - name: Build OSRM driving graph
        run: |
          docker --version
          chmod +x scripts/build-routing.sh
          pbf=$(find Maps -type f -name 'jamaica.osm.pbf' -print -quit)
          test -n "$pbf"
          echo "Using PBF: $pbf"
          bash scripts/build-routing.sh jamaica "$pbf" Maps/jamaica
      - uses: actions/upload-artifact@v4
        with:
          name: jamaica-routing-driving
          path: Maps/jamaica/*.osrm*
          retention-days: 14
