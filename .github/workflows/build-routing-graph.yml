name: Build offline driving graph

on:
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  routing:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build OSRM driving graph
        run: |
          docker --version
          chmod +x scripts/build-routing.sh
          mkdir -p Maps
          curl --fail --location --retry 3 --output Maps/jamaica.osm.pbf https://download.geofabrik.de/central-america/jamaica-latest.osm.pbf
          pbf=Maps/jamaica.osm.pbf
          bash scripts/build-routing.sh jamaica "$pbf" Maps/jamaica
      - uses: actions/upload-artifact@v4
        with:
          name: jamaica-routing-driving
          path: Maps/jamaica/*.osrm*
          retention-days: 14
