name: Package Offline Maps Windows app

on:
  workflow_dispatch:
    inputs:
      artifact-run:
        description: Successful workflow run containing the map and native artifacts
        required: true
        default: '31437658426'
        type: string

permissions:
  contents: read
  actions: read

jobs:
  package:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Download verified native bridge artifact
        uses: actions/download-artifact@v4
        with:
          name: native-bridge
          run-id: ${{ inputs.artifact-run }}
          github-token: ${{ github.token }}
          path: Native

      - name: Download verified Jamaica map artifact
        uses: actions/download-artifact@v4
        with:
          name: region-package
          run-id: ${{ inputs.artifact-run }}
          github-token: ${{ github.token }}
          path: Maps/jamaica

      - name: Publish WPF app
        shell: pwsh
        run: dotnet publish .\OfflineMaps.Win.csproj -c Release -r win-x64 --self-contained false -o .\publish

      - name: Assemble Jamaica package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force publish\Native, publish\Maps\jamaica | Out-Null
          Copy-Item Native\MapLibreBridge.dll publish\Native\MapLibreBridge.dll -Force
          Copy-Item Maps\jamaica publish\Maps\jamaica -Recurse -Force
          Copy-Item Maps\jamaica-style.json publish\Maps\jamaica-style.json -Force

      - name: Record source artifact digests
        shell: pwsh
        run: |
          @"
          Source workflow run: 31437658426
          native-bridge artifact digest: sha256:14870f5e3a874bdda99b3b511a1258b4d2cb18afa502caef2fe0333ec82eb8b1
          region-package artifact digest: sha256:37130cb06a2a99f0493473cff2eb4c0040c6bc272563fa68a8fb6ebf2d47af14
          "@ | Set-Content publish\ARTIFACT-SOURCES.txt

      - uses: actions/upload-artifact@v4
        with:
          name: bpmapwin-jamaica-windows
          path: publish/
          retention-days: 14
