name: Build native MapLibre bridge

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-native:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Install CMake and Ninja
        uses: lukka/get-cmake@latest
      - name: Initialize MSVC environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - name: Checkout MapLibre Native
        shell: pwsh
        run: |
          git config --global core.longpaths true
          New-ItemProperty -Path 'HKLM:\SYSTEM\CurrentControlSet\Control\FileSystem' -Name LongPathsEnabled -Value 1 -PropertyType DWord -Force | Out-Null
          git -c core.longpaths=true clone --recurse-submodules --depth 1 https://github.com/maplibre/maplibre-native.git $env:RUNNER_TEMP\maplibre-native
      - name: Configure MapLibre Native
        shell: pwsh
        run: |
          Set-Location $env:RUNNER_TEMP\maplibre-native
          $env:CC = "cl"
          $env:CXX = "cl"
          cmake --list-presets
          cmake --preset windows-opengl
      - name: Build MapLibre Native
        shell: pwsh
        run: cmake --build $env:RUNNER_TEMP\maplibre-native\build-windows-opengl --config Release --target ALL_BUILD
      - name: Configure bridge
        shell: pwsh
        run: |
          & "$env:VCPKG_INSTALLATION_ROOT\vcpkg.exe" install sqlite3:x64-windows
          cmake -S Native -B Native\build -DCMAKE_BUILD_TYPE=Release -A x64 -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_INSTALLATION_ROOT\scripts\buildsystems\vcpkg.cmake"
      - name: Build bridge
        shell: pwsh
        run: cmake --build Native\build --config Release
      - name: Upload native artifacts
        uses: actions/upload-artifact@v4
        with:
          name: maplibre-native-windows
          path: |
            Native/build/Release/MapLibreBridge.dll
            ${{ runner.temp }}/maplibre-native/build-windows-opengl/bin/Release/*.dll
          if-no-files-found: warn
