name: Build Jamaica offline map

on:
  workflow_dispatch:
    inputs:
      region:
        description: Region to build
        required: true
        default: jamaica
        type: choice
        options:
          - jamaica
          - cayman-islands
  schedule:
    - cron: '0 4 1 * *'

permissions:
  contents: read

jobs:
  build-region:
    runs-on: ubuntu-latest
    steps:
      - name: Check out project
        uses: actions/checkout@v4
      - name: Install conversion dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y osmium-tool libboost-system-dev libboost-filesystem-dev libboost-program-options-dev rapidjson-dev liblua5.3-dev libshp-dev libsqlite3-dev
          git clone --depth 1 https://github.com/systemed/tilemaker.git "$RUNNER_TEMP/tilemaker"
          cmake -S "$RUNNER_TEMP/tilemaker" -B "$RUNNER_TEMP/tilemaker/build" -DCMAKE_BUILD_TYPE=Release
          cmake --build "$RUNNER_TEMP/tilemaker/build" --parallel 2
          echo "$RUNNER_TEMP/tilemaker/build" >> "$GITHUB_PATH"
      - name: Download OSM PBF
        run: |
          mkdir -p Maps
          region='${{ inputs.region || 'jamaica' }}'
          if [ "$region" = "cayman-islands" ]; then
            url='https://geo2day.com/central_america/cayman_islands.pbf'
          else
            url='https://download.geofabrik.de/central-america/jamaica-latest.osm.pbf'
          fi
          curl --fail --location --retry 3 --output "Maps/$region.osm.pbf" "$url"
      - name: Build MBTiles and offline search database
        shell: pwsh
        run: |
          $region = "${{ inputs.region || 'jamaica' }}"
          ./scripts/build-region.ps1 -RegionId $region -InputPbf "./Maps/$region.osm.pbf" -TilemakerConfig "$env:RUNNER_TEMP/tilemaker/resources/config-openmaptiles.json" -TilemakerProcess "$env:RUNNER_TEMP/tilemaker/resources/process-openmaptiles.lua"
      - name: Upload generated map package
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.region || 'jamaica' }}-offline-map
          path: Maps/${{ inputs.region || 'jamaica' }}/
          if-no-files-found: error
          retention-days: 14
